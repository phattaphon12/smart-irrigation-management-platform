services:
  db:
    image: postgres
    container_name: postgres-simp
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  mqtt:
    image: eclipse-mosquitto
    container_name: mosquitto-simp
    restart: always
    ports:
      - "1883:1883"      # Default MQTT port
      - "9001:9001"      # MQTT over WebSockets (useful for Next.js frontend)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  backend:
    build: ./SIMP-backend
    container_name: backend-simp
    restart: always
    depends_on:
      - db
      - mqtt
    environment:
      PORT: 4000
      CORS_ORIGIN: http://simp.eng.kmitl.ac.th
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${APP_DB_USER}
      PGPASSWORD: ${APP_DB_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      AMBIENT_API_KEY: ${AMBIENT_API_KEY}
      AMBIENT_APPLICATION_KEY: ${AMBIENT_APPLICATION_KEY}
      AMBIENT_STATION_MAC: ${AMBIENT_STATION_MAC}
    expose:
      - "4000"

  frontend:
    build:
      context: ./SIMP-dashboard
      args:
        VITE_BACKEND_URL: http://simp.eng.kmitl.ac.th
        VITE_USE_LIVE_WEATHER: "true"
    container_name: frontend-simp
    restart: always
    depends_on:
      - backend
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: nginx-simp
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
